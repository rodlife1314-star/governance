kind = "web"
previewPath = "/spatial/"
title = "OCTAGON Spatial"
version = "1.0.0"
id = "artifacts/spatial"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/spatial/" ]
localPort = 22711

[services.development]
run = "pnpm --filter @workspace/spatial run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spatial", "run", "build" ]
publicDir = "artifacts/spatial/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22711"
BASE_PATH = "/spatial/"
